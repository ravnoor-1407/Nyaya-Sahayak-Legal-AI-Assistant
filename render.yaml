services:
  - type: web
    name: nyayasahayak-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m scripts.build_chunks && python -m scripts.ingest"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PRIMARY
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBED_MODEL
        value: intfloat/multilingual-e5-base
      - key: ENVIRONMENT
        value: production
      - key: DEBUG_OTP
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
